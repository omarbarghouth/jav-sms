<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hazard Report — Jordan Aviation</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f0f2f8;min-height:100vh;font-family:'IBM Plex Sans',sans-serif;color:#111827}
  .header{background:#0f1c3f;border-bottom:3px solid #c9a84c}
  .header-inner{max-width:760px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:12px}
  .logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#c9a84c,#a8832a);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .logo-text h1{color:#fff;font-size:14px;font-weight:800}
  .logo-text p{color:rgba(255,255,255,.5);font-size:11px}
  .back{margin-left:auto;color:rgba(255,255,255,.5);font-size:12px;text-decoration:none}
  .back:hover{color:#c9a84c}
  .form-wrap{max-width:680px;margin:32px auto;padding:0 20px 40px}
  .form-title{font-size:24px;font-weight:800;color:#0f1c3f;margin-bottom:6px}
  .form-sub{font-size:13px;color:#6b7280;margin-bottom:24px;line-height:1.6}
  .form-card{background:#fff;border-radius:14px;border:1px solid #e5e7eb;padding:28px 30px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  .sec{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#0f1c3f;padding:9px 0 6px;border-bottom:2px solid #c9a84c;margin:18px 0 14px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .fg label{font-size:10.5px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.4px}
  .fg input,.fg select,.fg textarea{border:1.5px solid #e5e7eb;border-radius:7px;padding:9px 12px;background:#fafbfe;font-family:inherit;font-size:13px;width:100%;transition:border-color .15s}
  .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#0f1c3f;outline:none}
  .fg textarea{resize:vertical;min-height:90px}
  .opt-tag{display:inline-block;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;margin-left:6px}
  .conf-tag{display:inline-block;background:#f3e8ff;color:#7c3aed;border:1px solid #d8b4fe;padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;margin-left:6px}
  .notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 16px;font-size:12px;color:#1d4ed8;margin-bottom:20px;line-height:1.6}
  .conf-notice{background:#f3e8ff;border:1px solid #d8b4fe;border-radius:8px;padding:12px 16px;font-size:12px;color:#7c3aed;margin-bottom:20px;line-height:1.6}
  .btn-submit{background:#0f1c3f;color:#fff;border:none;border-radius:8px;padding:13px 32px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
  .btn-submit:hover{background:#1a2d5a}
  .btn-cancel{display:inline-block;color:#6b7280;text-decoration:none;font-size:13px;margin-left:16px}</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="logo-icon">✈</div>
    <div class="logo-text"><h1>Jordan Aviation</h1><p>Safety Reporting Portal</p></div>
    <a href="/portal" class="back">← All Reports</a>
  </div>
</div>
<div class="form-wrap">
  <div class="form-title">Hazard Report</div>
  <div class="form-sub">Report any hazard or unsafe condition. Your name is optional.</div>
  <div class="form-card">
  <form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <input type="hidden" name="report_type" value="Hazard Report"/>
    <div class="sec">Reporter <span class="opt-tag">Optional</span></div>
    <div class="g2">
      <div class="fg"><label>Your Name <span class="opt-tag">Optional</span></label>
        <input type="text" name="reporter" placeholder="Leave blank for anonymous"/></div>
      <div class="fg"><label>Department *</label>
              <select name="department_id">
        <option value="">Select department…</option>
        {% for d in all_departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
      </select>
      </div>
    </div>
    <div class="sec">Hazard Details</div>
    <div class="g2">
      <div class="fg"><label>Date *</label><input type="date" name="date" required/></div>
      <div class="fg"><label>Location *</label><input type="text" name="location" required placeholder="e.g. Ramp, Runway 24, Gate 5"/></div>
    </div>
    <div class="g2">
      <div class="fg"><label>Hazard Classification *</label>
        <select name="classification" required>
          <option>Operational</option><option>Ground Operations</option><option>Maintenance</option><option>Airside</option><option>Landside</option><option>Aircraft</option><option>Environmental</option><option>Other</option>
        </select></div>
      <div class="fg"><label>Hazard Type</label>
        <select name="generic_hazard">
          <option>Foreign Object Debris (FOD)</option><option>Wildlife / Bird Strike Risk</option><option>Slippery Surface</option><option>Equipment Malfunction</option><option>Fuel Hazard</option><option>Electrical Hazard</option><option>Structural Damage</option><option>Visibility Obstruction</option><option>Unauthorized Access</option><option>Other</option>
        </select></div>
    </div>
    <div class="fg"><label>Hazard Description *</label>
      <textarea name="hazard_description" required rows="5" placeholder="Describe the hazard clearly — what you saw, where, and when…"></textarea></div>
    <div class="fg"><label>Potential Consequences</label>
      <textarea name="consequences" rows="3" placeholder="What could go wrong if this hazard is not addressed?"></textarea></div>
    <div class="fg"><label>Suggested Mitigation <span class="opt-tag">Optional</span></label>
      <textarea name="suggested_mitigation" rows="2" placeholder="How could this hazard be controlled or eliminated?"></textarea></div>
    <div style="margin-top:20px;display:flex;align-items:center">
      <button type="submit" class="btn-submit">⚠️ Submit Hazard Report</button>
      <a href="/portal" class="btn-cancel">Cancel</a>
    </div>
  </form>
  </div>
</div>
</body>
</html>

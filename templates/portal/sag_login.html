<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SAG Member Login — Jordan Aviation</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',sans-serif;background:#eef0f6;color:#111827;font-size:14px;min-height:100vh}
a{text-decoration:none;color:inherit}

.sag-header{background:#0f1c3f;border-bottom:3px solid #c9a84c;padding:0}
.sag-header-inner{max-width:1000px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
.sag-logo{width:36px;height:36px;background:linear-gradient(135deg,#c9a84c,#a8832a);border-radius:9px;
          display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.sag-title{color:#fff;font-size:13px;font-weight:800}
.sag-subtitle{color:rgba(255,255,255,.5);font-size:10px;margin-top:1px}
.sag-user-pill{margin-left:auto;display:flex;align-items:center;gap:10px}
.sag-user-name{color:rgba(255,255,255,.7);font-size:12px;font-weight:600}
.sag-user-role{color:var(--gold,#c9a84c);font-size:10px;font-weight:700;background:rgba(201,168,76,.15);
               padding:3px 10px;border-radius:99px;border:1px solid rgba(201,168,76,.3)}
.sag-logout{color:rgba(255,255,255,.4);font-size:11px;padding:5px 10px;border:1px solid rgba(255,255,255,.15);
            border-radius:5px;transition:all .15s}
.sag-logout:hover{color:#fff;border-color:rgba(255,255,255,.4)}

.sag-wrap{max-width:1000px;margin:0 auto;padding:28px 24px}
.page-title{font-size:21px;font-weight:800;color:#0f1c3f;letter-spacing:-.3px;margin-bottom:4px}
.page-sub{color:#6b7280;font-size:12.5px;margin-bottom:20px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:22px}
.stat-card{background:#fff;border-radius:10px;border:1px solid #e5e7eb;padding:16px;
           box-shadow:0 1px 4px rgba(15,28,63,.05);border-top:3px solid var(--accent,#e5e7eb)}
.stat-val{font-size:28px;font-weight:800;font-family:'IBM Plex Mono',monospace;margin-bottom:5px;
          color:var(--accent,#0f1c3f)}
.stat-lbl{font-size:10px;color:#6b7280;font-weight:700;text-transform:uppercase;letter-spacing:.4px}

.card{background:#fff;border-radius:10px;border:1px solid #e5e7eb;
      box-shadow:0 1px 4px rgba(15,28,63,.05);padding:20px;margin-bottom:16px}
.card-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;
            color:#0f1c3f;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card-title::after{content:'';flex:1;height:1px;background:#e5e7eb}

.badge{display:inline-flex;align-items:center;border-radius:5px;padding:2px 8px;
       font-size:10.5px;font-weight:700;white-space:nowrap}
.b-red   {background:#fff0f0;color:#dc2626;border:1px solid #fecaca}
.b-yellow{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.b-orange{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.b-green {background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.b-blue  {background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.b-purple{background:#faf5ff;color:#7c3aed;border:1px solid #e9d5ff}
.b-navy  {background:#0f1c3f;color:#fff;border:1px solid #1a2d5a}
.b-gray  {background:#f9fafb;color:#6b7280;border:1px solid #e5e7eb}
.b-dot::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;
               flex-shrink:0;display:inline-block;margin-right:3px}

.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid #e5e7eb}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f3f5fa;color:#374151;font-weight:700;font-size:10px;text-transform:uppercase;
   letter-spacing:.6px;padding:10px 14px;text-align:left;border-bottom:2px solid #e5e7eb;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #f2f4f8;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f8f9fd}
.row-danger td{background:#fff8f8!important}
.row-warn td{background:#fffbeb!important}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:7px;
     font-weight:700;font-size:12.5px;cursor:pointer;border:none;font-family:inherit;
     transition:all .13s ease;white-space:nowrap;line-height:1}
.btn:active{transform:scale(.98)}
.btn-navy{background:#0f1c3f;color:#fff}
.btn-navy:hover{background:#1a2d5a;transform:translateY(-1px)}
.btn-gold{background:#c9a84c;color:#0f1c3f}
.btn-gold:hover{background:#b8963e}
.btn-success{background:#15803d;color:#fff}
.btn-success:hover{background:#166534}
.btn-outline{background:#fff;color:#0f1c3f;border:1.5px solid #d1d5db}
.btn-outline:hover{border-color:#0f1c3f}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:6px}

.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{border:1.5px solid #e5e7eb;border-radius:7px;padding:9px 12px;
   background:#fafbfe;font-family:inherit;font-size:13px;width:100%;
   transition:border-color .13s ease;color:#111827}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#0f1c3f;outline:none;background:#fff;
   box-shadow:0 0 0 3px rgba(15,28,63,.06)}
.fg textarea{resize:vertical;min-height:80px;line-height:1.6}
.sec{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:#0f1c3f;
     padding:8px 0 6px;border-bottom:2px solid #c9a84c;margin:18px 0 14px}

.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.progress-bar{height:100%;border-radius:99px;transition:width .4s ease}

.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#0f1c3f}

@media(max-width:700px){
  .sag-wrap{padding:16px}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
}

body{display:flex;align-items:center;justify-content:center;background:#0a1428;min-height:100vh}
.login-box{background:#fff;border-radius:14px;padding:44px 44px 36px;width:100%;max-width:400px;
            box-shadow:0 20px 60px rgba(0,0,0,.4)}
.logo-area{text-align:center;margin-bottom:28px}
.logo-icon{width:56px;height:56px;background:linear-gradient(135deg,#c9a84c,#a8832a);
             border-radius:14px;display:flex;align-items:center;justify-content:center;
             font-size:26px;margin:0 auto 12px}
.logo-area h1{font-size:15px;font-weight:800;color:#0f1c3f}
.logo-area p{font-size:11px;color:#6b7280;margin-top:3px}
.error-bar{background:#fff5f5;color:#dc2626;border:1px solid #fca5a5;padding:10px 14px;
            border-radius:7px;font-size:12px;font-weight:700;margin-bottom:16px;text-align:center}
.portal-links{text-align:center;margin-top:18px;font-size:12px;color:#9ca3af}
.portal-links a{color:#c9a84c;font-weight:700}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo-area">
    <div class="logo-icon">🛡</div>
    <h1>SAG Member Portal</h1>
    <p>Safety Action Group · Jordan Aviation SMS</p>
  </div>
  {% if error %}
  <div class="error-bar">✗ {{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="fg"><label>Username</label>
      <input type="text" name="username" autofocus placeholder="Your SAG username"/></div>
    <div class="fg"><label>Password</label>
      <input type="password" name="password" placeholder="Password"/></div>
    <button type="submit" class="btn btn-navy" style="width:100%;justify-content:center;
            padding:13px;font-size:14px;margin-top:4px">
      Sign In to SAG Portal →
    </button>
  </form>
  <div class="portal-links">
    <a href="/portal">← Public Reporting Portal</a> &nbsp;·&nbsp;
    <a href="/admin/login">Safety Admin</a>
  </div>
</div>
</body>
</html>

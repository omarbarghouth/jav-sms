<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SAG Login — AviaS</title>
<link rel="icon" type="image/svg+xml" href="/static/avias-logo.svg"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:#eef0f6;color:#111827;font-size:14px;min-height:100vh}
a{text-decoration:none;color:inherit}
.sag-hdr{background:#0f1c3f;border-bottom:3px solid #c9a84c}
.sag-hdr-in{max-width:1000px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:12px}
.sag-logo{width:36px;height:36px;background:linear-gradient(135deg,#c9a84c,#a8832a);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.sag-ttl{color:#fff;font-size:13px;font-weight:800}
.sag-sub{color:rgba(255,255,255,.5);font-size:10px;margin-top:1px}
.user-area{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-name{color:rgba(255,255,255,.8);font-size:12px;font-weight:700}
.user-role{background:rgba(201,168,76,.15);color:#c9a84c;border:1px solid rgba(201,168,76,.3);padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700}
.lnk{color:rgba(255,255,255,.45);font-size:11px;padding:5px 10px;border:1px solid rgba(255,255,255,.15);border-radius:5px;transition:.15s}
.lnk:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.wrap{max-width:1000px;margin:0 auto;padding:26px 22px}
.page-title{font-size:21px;font-weight:800;color:#0f1c3f;letter-spacing:-.3px;margin-bottom:4px}
.page-sub{color:#6b7280;font-size:12.5px;margin-bottom:18px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:11px;margin-bottom:20px}
.sc{background:#fff;border-radius:9px;border:1px solid #e5e7eb;padding:14px;border-top:3px solid var(--a,#e5e7eb);box-shadow:0 1px 4px rgba(15,28,63,.05)}
.sv{font-size:27px;font-weight:800;font-family:'IBM Plex Mono',monospace;color:var(--a,#0f1c3f);margin-bottom:4px}
.sl{font-size:10px;color:#6b7280;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.card{background:#fff;border-radius:9px;border:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(15,28,63,.05);padding:18px;margin-bottom:14px}
.ct{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#0f1c3f;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.ct::after{content:'';flex:1;height:1px;background:#e5e7eb}
.badge{display:inline-flex;align-items:center;border-radius:5px;padding:2px 8px;font-size:10.5px;font-weight:700;white-space:nowrap}
.br{background:#fff0f0;color:#dc2626;border:1px solid #fecaca}
.by{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.bg{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.bb{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.bp{background:#faf5ff;color:#7c3aed;border:1px solid #e9d5ff}
.bn{background:#0f1c3f;color:#fff;border:1px solid #1a2d5a}
.bx{background:#f9fafb;color:#6b7280;border:1px solid #e5e7eb}
.bd::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;display:inline-block;margin-right:3px}
.tbl-w{overflow-x:auto;border-radius:8px;border:1px solid #e5e7eb}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f3f5fa;color:#374151;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:10px 14px;text-align:left;border-bottom:2px solid #e5e7eb;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #f2f4f8;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f8f9fd}
.rd td{background:#fff8f8!important}
.ry td{background:#fffbeb!important}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 17px;border-radius:7px;font-weight:700;font-size:12.5px;cursor:pointer;border:none;font-family:inherit;transition:.13s;white-space:nowrap}
.btn-n{background:#0f1c3f;color:#fff}
.btn-n:hover{background:#1a2d5a;transform:translateY(-1px)}
.btn-g{background:#c9a84c;color:#0f1c3f}
.btn-s{background:#15803d;color:#fff}
.btn-s:hover{background:#166534}
.btn-o{background:#fff;color:#0f1c3f;border:1.5px solid #d1d5db}
.btn-o:hover{border-color:#0f1c3f}
.btn-sm{padding:5px 11px;font-size:11px;border-radius:6px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{border:1.5px solid #e5e7eb;border-radius:7px;padding:9px 12px;background:#fafbfe;font-family:inherit;font-size:13px;width:100%;transition:.13s;color:#111827}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#0f1c3f;outline:none;background:#fff;box-shadow:0 0 0 3px rgba(15,28,63,.06)}
.fg textarea{resize:vertical;min-height:80px;line-height:1.6}
.sec{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:#0f1c3f;padding:8px 0 6px;border-bottom:2px solid #c9a84c;margin:16px 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#0f1c3f}
.alert-r{background:#fff5f5;border:2px solid #fca5a5;border-radius:8px;padding:13px 16px;margin-bottom:16px;color:#dc2626;font-size:13px}
.alert-b{background:#eff6ff;border:2px solid #bfdbfe;border-radius:8px;padding:13px 16px;margin-bottom:16px;color:#1d4ed8;font-size:13px}
.alert-g{background:#f0fdf4;border:2px solid #bbf7d0;border-radius:8px;padding:13px 16px;margin-bottom:16px;color:#15803d;font-size:13px}
.flash-s{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;padding:10px 14px;border-radius:7px;font-size:12.5px;font-weight:600;margin-bottom:14px}
.flash-e{background:#fff5f5;color:#dc2626;border:1px solid #fca5a5;padding:10px 14px;border-radius:7px;font-size:12.5px;font-weight:600;margin-bottom:14px}
@media(max-width:680px){.stat-grid{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr}.wrap{padding:14px}}

body{display:flex;align-items:center;justify-content:center;background:#0a1428;min-height:100vh}
.box{background:#fff;border-radius:14px;padding:42px 42px 34px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.logo-wrap{text-align:center;margin-bottom:26px}
.li{width:64px;height:64px;border-radius:14px;display:block;margin:0 auto 12px}
.err{background:#fff5f5;color:#dc2626;border:1px solid #fca5a5;padding:10px 14px;border-radius:7px;font-size:12px;font-weight:700;margin-bottom:16px;text-align:center}
.links{text-align:center;margin-top:16px;font-size:12px;color:#9ca3af}
.links a{color:#c9a84c;font-weight:700}
</style>
</head><body>
<div class="box">
  <div class="logo-wrap">
    <img src="/static/avias-logo.svg" alt="AviaS" class="li"/>
    <div style="font-size:15px;font-weight:800;color:#0f1c3f">SAG Member Portal</div>
    <div style="font-size:11px;color:#6b7280;margin-top:3px">Safety Action Group · AviaS Safety Management System</div>
  </div>
  {% if error %}<div class="err">✗ {{ error }}</div>{% endif %}
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="fg"><label>Username</label><input type="text" name="username" autofocus placeholder="Your SAG username"/></div>
    <div class="fg"><label>Password</label><input type="password" name="password" placeholder="Password"/></div>
    <button type="submit" class="btn btn-n" style="width:100%;justify-content:center;padding:12px;font-size:14px;margin-top:4px">
      Sign In to SAG Portal →
    </button>
  </form>
  <div class="links"><a href="/portal">← Public Portal</a> &nbsp;·&nbsp; <a href="/admin/login">Safety Admin</a></div>
</div>
</body></html>

{% extends "base.html" %}
{% block title %}New Survey{% endblock %}
{% block content %}
<div style="margin-bottom:14px"><a href="/safety-promotion/surveys" style="color:var(--muted);font-size:13px">← Surveys</a></div>
<div class="page-title">Create Safety Survey</div>
<form class="form-card" method="POST" style="max-width:640px">
  <div class="sec">Survey Details</div>
  <div class="fg"><label>Survey Title *</label><input type="text" name="title" required placeholder="e.g. Annual Safety Culture Survey 2026"/></div>
  <div class="g2">
    <div class="fg"><label>Survey Type *</label>
      <select name="survey_type" required>
        {% for t in ["Safety Culture Survey","Fatigue Survey","Training Feedback","Reporting Culture Survey","Operational Safety Survey","Human Factors Survey"] %}
        <option>{{ t }}</option>{% endfor %}
      </select></div>
    <div class="fg"><label>Target Responses</label><input type="number" name="target_count" min="0" value="50"/></div>
  </div>
  <div class="fg"><label>Department (optional)</label>
    <select name="department_id">
      <option value="">All Departments</option>
      {% for d in all_departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
    </select></div>
  <div class="g2">
    <div class="fg"><label>Start Date</label><input type="date" name="start_date"/></div>
    <div class="fg"><label>End Date</label><input type="date" name="end_date"/></div>
  </div>
  <div class="fg"><label>Description</label><textarea name="description" rows="2" placeholder="Survey purpose and objectives…"></textarea></div>
  <div class="sec">Survey Questions</div>
  <div id="questions">
    {% for i in range(5) %}
    <div class="fg"><label>Question {{ i+1 }}</label><input type="text" name="question" placeholder="Survey question {{ i+1 }}…"/></div>
    {% endfor %}
  </div>
  <button type="button" onclick="addQ()" class="btn btn-outline btn-sm">+ Add Question</button>
  <div style="display:flex;gap:10px;margin-top:14px">
    <button type="submit" class="btn btn-nav">📋 Create Survey</button>
    <a href="/safety-promotion/surveys" class="btn btn-outline">Cancel</a>
  </div>
</form>
{% endblock %}
{% block scripts %}
<script>
var qc = 5;
function addQ() {
  qc++;
  var d = document.createElement("div"); d.className = "fg";
  d.innerHTML = "<label>Question "+qc+"</label><input type=text name=question placeholder='Survey question "+qc+"…' style='border:1px solid #e5e7eb;border-radius:5px;padding:7px 9px;font-size:13px;font-family:inherit;width:100%'/>";
  document.getElementById("questions").appendChild(d);
}
</script>
{% endblock %}

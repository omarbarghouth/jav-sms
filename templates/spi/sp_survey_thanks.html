<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Thank You</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#f0f2f8;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif}
.box{background:#fff;border-radius:14px;padding:48px 40px;max-width:480px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.icon{width:72px;height:72px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px}
h1{font-size:22px;font-weight:800;color:#0f1c3f;margin-bottom:10px}p{font-size:14px;color:#6b7280;line-height:1.7}</style>
</head><body><div class="box">
  <div class="icon">✓</div>
  <h1>Thank You!</h1>
  <p>Your response to <strong>{{ survey.title }}</strong> has been submitted successfully.</p>
  <p style="margin-top:12px">Your feedback helps us improve aviation safety across Jordan Aviation.</p>
</div></body></html>

{% extends "base.html" %}
{% block title %}New Safety Bulletin{% endblock %}
{% block content %}
<div style="margin-bottom:14px"><a href="/safety-promotion/bulletins" style="color:var(--muted);font-size:13px">← Bulletins</a></div>
<div class="page-title">Publish Safety Bulletin</div>
<form class="form-card" method="POST" enctype="multipart/form-data" style="max-width:640px">
  <div class="sec">Bulletin Information</div>
  <div class="g2">
    <div class="fg"><label>Bulletin Reference</label><input type="text" name="ref_number" placeholder="e.g. SB-2026-001"/></div>
    <div class="fg"><label>Bulletin Type *</label>
      <select name="bulletin_type" required>
        {% for t in ["Bulletin","Alert","Urgent","Operational","Hazard Awareness","Lessons Learned"] %}<option>{{ t }}</option>{% endfor %}
      </select></div>
  </div>
  <div class="fg"><label>Title *</label><input type="text" name="title" required placeholder="Bulletin title…"/></div>
  <div class="g2">
    <div class="fg"><label>Severity</label>
      <select name="severity">
        {% for s in ["Information","High","Critical"] %}<option>{{ s }}</option>{% endfor %}
      </select></div>
    <div class="fg"><label>Department</label>
      <select name="department_id">
        <option value="">All Departments</option>
        {% for d in all_departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
      </select></div>
  </div>
  <div class="g2">
    <div class="fg"><label>Issue Date</label><input type="date" name="issue_date" value="{{ now.strftime("%Y-%m-%d") }}"/></div>
    <div class="fg"><label>Issued By</label><input type="text" name="issued_by" placeholder="Safety Department"/></div>
  </div>
  <div class="sec">Content</div>
  <div class="fg"><label>Bulletin Content *</label><textarea name="content" required rows="8" placeholder="Describe the safety bulletin…"></textarea></div>
  <div class="fg"><label>Recommendations</label><textarea name="recommendations" rows="3" placeholder="Corrective recommendations…"></textarea></div>
  <div class="fg"><label>Related Hazard ID (optional)</label><input type="text" name="linked_hazard_id" placeholder="e.g. HAZ-SMS-01"/></div>
  <div class="fg"><label>Attachment (PDF, DOCX, Image)</label>
    <input type="file" name="attachment" accept=".pdf,.docx,.xlsx,.png,.jpg,.jpeg"
           style="border:1.5px solid var(--border);border-radius:7px;padding:8px;font-size:12px;font-family:inherit;background:#fafbfe"/></div>
  <div style="display:flex;gap:10px;margin-top:8px">
    <button type="submit" class="btn btn-nav">📢 Publish Bulletin</button>
    <a href="/safety-promotion/bulletins" class="btn btn-outline">Cancel</a>
  </div>
</form>
{% endblock %}

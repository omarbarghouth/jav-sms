<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Safety Admin Login — Jordan Aviation</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a1428;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif}
  .box{background:#fff;border-radius:14px;padding:44px 44px 36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .logo{text-align:center;margin-bottom:28px}
  .logo-icon{width:56px;height:56px;background:linear-gradient(135deg,#c9a84c,#a8832a);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px}
  .logo h1{font-size:15px;font-weight:800;color:#0f1c3f}
  .logo p{font-size:12px;color:#6b7280;margin-top:3px}
  .badge{display:inline-block;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;padding:8px 14px;border-radius:7px;font-size:12px;font-weight:700;width:100%;text-align:center;margin-bottom:16px}
  .fg{margin-bottom:16px}
  .fg label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#374151;margin-bottom:5px}
  .fg input{width:100%;border:1.5px solid #e5e7eb;border-radius:8px;padding:11px 14px;font-size:14px;font-family:inherit;transition:border-color .15s}
  .fg input:focus{border-color:#0f1c3f;outline:none}
  .btn{width:100%;background:#0f1c3f;color:#fff;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;margin-top:4px}
  .btn:hover{background:#1a2d5a}
  .portal-link{text-align:center;margin-top:18px;font-size:12px;color:#9ca3af}
  .portal-link a{color:#c9a84c;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-icon">✈</div>
    <h1>Jordan Aviation</h1>
    <p>Safety Management System — Admin Portal</p>
  </div>
  {% if error %}
  <div class="badge">✗ {{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="fg"><label>Username</label><input type="text" name="username" autofocus placeholder="Safety admin username"/></div>
    <div class="fg"><label>Password</label><input type="password" name="password" placeholder="Password"/></div>
    <button type="submit" class="btn">Sign In to Safety Admin →</button>
  </form>
  <div class="portal-link">
    Not an admin? <a href="/portal">Go to Reporting Portal →</a>
  </div>
</div>
</body>
</html>
